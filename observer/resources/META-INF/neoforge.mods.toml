# 说明：NeoForge（1.20.5+ / 1.21.1）读取的是 META-INF/neoforge.mods.toml；
# Forge 1.20.1 实际读取同目录下的 META-INF/mods.toml。此文件保留同名布局以便与参考工程对齐，
# 内容与 mods.toml 完全一致（Forge 1.20.1 会忽略它）。
modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

[[mods]]
modId="gytrinket_observer"
version="${mod_version}"
displayName="Gytrinket Observer"
description='''
Observation and control tooling: server HTTP API (/status /block /region /command /top /dump),
/obs commands, client HTTP API + file console for camera/screenshot/FOV/HUD.
'''

[[dependencies.gytrinket_observer]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.gytrinket_observer]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
